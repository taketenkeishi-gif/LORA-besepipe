<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d1c"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="slabA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="slabB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowA" x="-30%" y="-10%" width="160%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowB" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- slab A: vertical (matrix A) -->
  <rect x="10" y="10" width="15" height="44" rx="3.5" fill="url(#slabA)" filter="url(#glowA)"/>

  <!-- slab B: horizontal (matrix B) -->
  <rect x="29" y="39" width="25" height="15" rx="3.5" fill="url(#slabB)" filter="url(#glowB)"/>

  <!-- × connector -->
  <line x1="25" y1="42" x2="30" y2="47" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="30" y1="42" x2="25" y2="47" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- rank dots on B -->
  <circle cx="34" cy="44.5" r="1.8" fill="white" opacity="0.5"/>
  <circle cx="39" cy="44.5" r="1.8" fill="white" opacity="0.5"/>
  <circle cx="44" cy="44.5" r="1.8" fill="white" opacity="0.5"/>
</svg>
